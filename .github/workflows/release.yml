# Builds ready-to-run Mocktroid downloads (Java bundled, nothing to install) for
# Windows, macOS (Apple Silicon + Intel) and Linux.
#
#   - Every push to main: the zips are attached to the workflow run (Actions tab > run > Artifacts).
#   - Pushing a tag like v0.2.0: the zips are also published as a GitHub Release.
#   - Or run it by hand from the Actions tab ("Run workflow").
name: Build downloads

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          # macos-13 was retired (jobs just sit queued for 24h); this is the Intel image now.
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the jar
        working-directory: source
        run: |
          chmod +x mvnw
          ./mvnw -B -q package

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # macOS app bundles can't have 0 as the first version number (jpackage refuses), so
          # 0.x.y becomes 1.x.y inside the Mac app only; file names keep the real version.
          if [[ "$RUNNER_OS" == "macOS" && "$v" == 0.* ]]; then appv="1.${v#0.}"; else appv="$v"; fi
          echo "appversion=$appv" >> "$GITHUB_OUTPUT"

      - name: macOS icon
        if: runner.os == 'macOS'
        working-directory: source/packaging
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Package (jpackage app image)
        working-directory: source
        run: |
          case "$RUNNER_OS" in
            Windows) icon=packaging/icon.ico ;;
            macOS)   icon=packaging/icon.icns ;;
            *)       icon=packaging/icon.png ;;
          esac
          mkdir -p target/jpk-in
          cp target/mocktroid.jar target/jpk-in/
          jpackage --type app-image \
            --input target/jpk-in --main-jar mocktroid.jar --main-class com.mocktroid.Launcher \
            --name Mocktroid --app-version "${{ steps.version.outputs.appversion }}" --icon "$icon" \
            --java-options "-Dfile.encoding=UTF-8" \
            --add-modules "java.base,java.desktop,java.logging,java.prefs,java.xml,java.scripting,java.net.http,jdk.unsupported,jdk.jsobject,jdk.xml.dom,java.management,jdk.crypto.ec,jdk.zipfs" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --dest target/dist

      - name: Zip
        working-directory: source/target/dist
        run: |
          out="Mocktroid-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../$out" Mocktroid >/dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent Mocktroid.app "../$out"
          else
            zip -qr "../$out" Mocktroid
          fi
          echo "ZIP=source/target/$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: Mocktroid-${{ matrix.name }}
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
